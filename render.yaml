services:
  - type: web
    name: resy-booker-api
    runtime: python
    pythonVersion: "3.11.0"
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resy-booker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random value
      - key: ENCRYPTION_KEY
        sync: false           # Generate and paste manually (see instructions below)
      - key: POLL_INTERVAL_SECONDS
        value: 60
      - key: ALLOWED_ORIGINS
        sync: false           # set to your Vercel URL, e.g. https://your-app.vercel.app

databases:
  - name: resy-booker-db
    plan: free
